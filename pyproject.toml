[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-image-1-9"
version = "0.3.0"
description = "Tri-capability Qwen-Image checkpoint pipeline: merge → train → abliterate → quantize → publish."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "accelerate>=0.30",
  "datasets>=2.18",
  "diffusers>=0.30",
  "huggingface-hub>=0.22",
  "matplotlib>=3.8",
  "peft>=0.10",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "rich>=13.7",
  "safetensors>=0.4",
  "torch>=2.2",
  "tqdm>=4.66",
  "transformers>=4.44"
]
authors = [
  { name = "Qwen-Image 1.9 Community Bridge" }
]
keywords = ["qwen", "image-generation", "image-editing", "image-layering", "lora", "diffusion"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.6",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
]

[project.scripts]
q19 = "qwen_image_19.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qwen_image_19 = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
